\* Liveness under fairness with two concurrent streams. Request kinds are
\* reduced to keep the temporal check tractable; Safety.cfg covers all kinds.
SPECIFICATION Spec
CONSTANTS
  Streams = {1, 2}
  HdrKinds = {"ok", "bad"}
  BodyKinds = {"empty", "ph"}
  Bug = "none"
PROPERTIES
  StreamsComplete
  HandlersFinish
